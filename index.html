<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>RXDZ | DZ HUP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07070a;
    --surface:rgba(255,255,255,0.035);
    --surface-2:#121319;
    --border:rgba(255,255,255,0.09);
    --ink:#f2f3f8;
    --muted:#878ca0;
    --violet:#7c6cff;
    --blue:#4aa3ff;
    --green:#1ecf8c;
    --green-deep:#149e6b;
    --discord:#5865F2;
    --telegram:#2AA9E0;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100dvh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:48px 18px 34px;
    position:relative;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- background: static grid + soft glows (GPU-cheap) ---------- */
  .grid-bg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(124,108,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,163,255,0.06) 1px, transparent 1px);
    background-size:52px 52px;
    -webkit-mask-image:radial-gradient(ellipse 85% 60% at 50% 15%, black 15%, transparent 75%);
            mask-image:radial-gradient(ellipse 85% 60% at 50% 15%, black 15%, transparent 75%);
  }

  .glow{
    position:fixed; border-radius:50%;
    filter:blur(90px);
    z-index:0; pointer-events:none;
    will-change:opacity, transform;
    animation:glow-pulse 7s ease-in-out infinite;
  }
  .glow.g1{ width:520px; height:520px; top:-180px; left:-180px; background:var(--violet); opacity:0.28; }
  .glow.g2{ width:460px; height:460px; bottom:-160px; right:-160px; background:var(--blue); opacity:0.24; animation-delay:2.3s; }
  @keyframes glow-pulse{
    0%,100%{ opacity:0.22; transform:scale(1); }
    50%{ opacity:0.34; transform:scale(1.08); }
  }
  @media (prefers-reduced-motion: reduce){ .glow{ animation:none; } }

  /* ---------- name color-cycle only (no glow, no border), violet <-> dark blue ---------- */
  .name-color{
    display:inline-block;
    animation:name-color-cycle 4.5s ease-in-out infinite alternate;
  }
  @keyframes name-color-cycle{
    0%{ color:#8b7bff; }
    100%{ color:#101b3d; }
  }
  @media (prefers-reduced-motion: reduce){ .name-color{ animation:none; color:#8b7bff; } }

  /* ---------- rainbow rising sparks (restrained to blue/violet range) ---------- */
  .sparks{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .spark{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, #b9c2ff 0%, #4a3fd6 45%, rgba(74,63,214,0) 75%);
    will-change:transform, filter;
    animation-name:spark-rise, spark-hue;
    animation-timing-function:linear, ease-in-out;
    animation-iteration-count:infinite, infinite;
  }
  @keyframes spark-rise{
    0%{ transform:translateY(0) translateX(0) scale(0.6); opacity:0; }
    10%{ opacity:1; }
    50%{ transform:translateY(-55vh) translateX(10px) scale(1); }
    90%{ opacity:0.55; }
    100%{ transform:translateY(-112vh) translateX(-8px) scale(0.4); opacity:0; }
  }
  @keyframes spark-hue{
    0%{ filter:hue-rotate(0deg) brightness(1); }
    50%{ filter:hue-rotate(45deg) brightness(1.15); }
    100%{ filter:hue-rotate(0deg) brightness(1); }
  }
  @media (prefers-reduced-motion: reduce){ .sparks{ display:none; } }

  main{
    position:relative; z-index:2;
    width:100%; max-width:440px;
    background:rgba(12,13,20,0.65);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-radius:32px;
    padding:36px 26px 30px;
    border:1px solid var(--border);
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
    display:flex; flex-direction:column; align-items:center;
  }

  /* ---------- kicker ---------- */
  .kicker{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:1.6px;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--border);
    padding:7px 16px; border-radius:999px;
    margin-bottom:24px;
  }
  .kicker .dot{
    width:7px; height:7px; border-radius:50%; background:var(--green);
    box-shadow:0 0 0 3px rgba(30,207,140,0.18);
    animation:dot-pulse 2.4s ease-in-out infinite;
  }
  @keyframes dot-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.45; } }

  /* ---------- avatar ---------- */
  .avatar-ring{
    width:96px; height:96px; border-radius:26px; padding:3px;
    background:linear-gradient(135deg, var(--violet), var(--blue));
    margin-bottom:16px;
    box-shadow:0 0 24px -4px rgba(124,108,255,0.45);
  }
  .avatar-inner{
    width:100%; height:100%; border-radius:23px; overflow:hidden;
    background:var(--surface-2);
  }
  .avatar-inner img{ width:100%; height:100%; object-fit:cover; display:block; }

  .name-row{ display:flex; align-items:center; gap:8px; }
  .name-row h1{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:29px;
  }
  .verified{
    width:19px; height:19px; background:var(--blue); border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .verified svg{ width:11px; height:11px; }

  .tagline{ margin-top:8px; font-size:13.5px; color:var(--muted); text-align:center; }

  /* ---------- section label ---------- */
  .section-label{
    width:100%; display:flex; align-items:center; gap:10px;
    margin:26px 0 12px;
  }
  .section-label span{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:1px; color:var(--muted);
    white-space:nowrap;
  }
  .section-label::before,.section-label::after{ content:''; flex:1; height:1px; background:var(--border); }

  /* ================= FEATURED CARD ================= */
  .exp-wrap{ position:relative; width:100%; }
  .exp-wrap::before{
    content:'';
    position:absolute; inset:-2px;
    background:linear-gradient(135deg, var(--violet), var(--blue));
    border-radius:22px;
    opacity:0.35;
    filter:blur(10px);
    z-index:0;
    transition:opacity .25s ease;
    will-change:opacity;
  }
  .exp-wrap:hover::before{ opacity:0.6; }

  .exp-card{
    --mx:50%; --my:50%;
    position:relative; z-index:1;
    display:block; width:100%;
    border-radius:20px; overflow:hidden;
    background:var(--surface-2);
    border:1px solid var(--border);
    text-decoration:none; color:var(--ink);
    transform:perspective(800px) rotateX(0deg) rotateY(0deg);
    transition:transform .2s ease;
  }
  .exp-card .spotlight{
    position:absolute; inset:0; z-index:3; pointer-events:none;
    background:radial-gradient(240px circle at var(--mx) var(--my), rgba(255,255,255,0.10), transparent 60%);
    opacity:0; transition:opacity .25s ease;
  }
  .exp-card:hover .spotlight{ opacity:1; }
  .exp-card:active{ transform:perspective(800px) scale(0.985); }

  .exp-thumb{ position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; }
  .exp-thumb img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s ease; }
  .exp-card:hover .exp-thumb img{ transform:scale(1.045); }
  .exp-thumb::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(7,7,10,0) 45%, rgba(7,7,10,0.92) 100%);
  }
  .badge-new{
    position:absolute; top:11px; right:11px; z-index:2;
    background:rgba(30,207,140,0.15); color:var(--green);
    border:1px solid rgba(30,207,140,0.35);
    font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:600; letter-spacing:0.6px;
    padding:4px 10px; border-radius:999px;
    backdrop-filter:blur(6px);
  }

  .exp-overlay{
    position:absolute; bottom:0; left:0; right:0; z-index:2;
    padding:14px 15px; display:flex; align-items:center; gap:11px;
  }
  .exp-icon{
    width:42px; height:42px; flex-shrink:0; border-radius:12px;
    background:linear-gradient(135deg, var(--violet), var(--blue));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 14px -6px rgba(124,108,255,0.6);
  }
  .exp-icon svg{ width:16px; height:16px; }
  .exp-info h3{ font-family:'Space Grotesk', sans-serif; font-size:17px; font-weight:700; }
  .exp-info span{ font-size:11.5px; color:var(--muted); }

  /* ================= SLIDE-TO-JOIN BUTTONS ================= */
  .links{ width:100%; display:flex; flex-direction:column; gap:13px; }

  .slide-btn{ --accent:var(--discord); position:relative; width:100%; }
  .discord{ --accent:var(--discord); }
  .telegram{ --accent:var(--telegram); }

  .slide-track{
    position:relative;
    width:100%; height:60px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    display:flex; align-items:center;
  }
  .slide-track .spotlight{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(160px circle at var(--mx,50%) var(--my,50%), color-mix(in srgb, var(--accent) 20%, transparent), transparent 65%);
    opacity:0; transition:opacity .25s ease;
  }
  .slide-btn:hover .spotlight{ opacity:1; }

  .slide-fill{
    position:absolute; top:0; right:0; bottom:0; z-index:1;
    width:0%;
    background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 45%, transparent));
    pointer-events:none;
  }

  .slide-label{
    position:relative; z-index:2;
    width:100%; text-align:center;
    font-size:13px; font-weight:600; color:var(--muted);
    letter-spacing:0.2px;
    pointer-events:none;
    transition:opacity .2s ease, color .2s ease;
  }
  .slide-label .hint-arrow{ display:inline-block; margin-inline-start:5px; animation:hint-nudge 1.7s ease-in-out infinite; opacity:0.55; }
  @keyframes hint-nudge{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(-5px); } }

  .slide-handle{
    position:absolute; z-index:3; top:4px; right:4px;
    width:52px; height:52px;
    border-radius:14px;
    background:var(--accent);
    display:flex; align-items:center; justify-content:center;
    cursor:grab;
    touch-action:pan-y;
    box-shadow:0 6px 16px -6px color-mix(in srgb, var(--accent) 75%, transparent);
    transition:box-shadow .2s ease, transform .15s ease;
  }
  .slide-handle:active{ cursor:grabbing; transform:scale(0.96); }
  .slide-handle svg{ width:23px; height:23px; pointer-events:none; }
  .slide-handle .handle-img{
    width:100%; height:100%; object-fit:cover;
    border-radius:14px; pointer-events:none; display:block;
  }

  .slide-btn.dragging .slide-track{ border-color:color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .slide-btn.success .slide-handle{
    box-shadow:0 0 0 7px color-mix(in srgb, var(--accent) 22%, transparent), 0 6px 16px -6px color-mix(in srgb, var(--accent) 75%, transparent);
  }
  .slide-btn.success .slide-label{ color:var(--ink); }

  .tap-ripple{
    position:absolute; border-radius:50%; z-index:2;
    background:rgba(255,255,255,0.4);
    transform:translate(-50%,-50%) scale(0);
    pointer-events:none;
    animation:ripple-anim .55s ease-out forwards;
  }
  @keyframes ripple-anim{ to{ transform:translate(-50%,-50%) scale(1); opacity:0; } }

  footer{
    margin-top:30px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px; color:var(--muted); letter-spacing:0.4px;
  }
  footer b{ color:var(--ink); }

  a:focus-visible{ outline:2px solid var(--blue); outline-offset:3px; }
</style>
</head>
