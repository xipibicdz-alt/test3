<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RXDZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090d;
    --surface:rgba(255,255,255,0.035);
    --surface-solid:#14151b;
    --border:rgba(255,255,255,0.09);
    --border-soft:rgba(255,255,255,0.06);
    --ink:#f4f5f9;
    --muted:#8b90a3;
    --violet:#8b7bff;
    --blue:#4ea1ff;
    --green:#17c983;
    --green-deep:#0f9a63;
    --discord:#5865F2;
    --telegram:#2AA9E0;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:52px 18px 32px;
    position:relative;
    overflow-x:hidden;
  }

  .glow{
    position:fixed;
    top:0; width:380px; height:100%;
    z-index:0; pointer-events:none;
    filter:blur(60px); opacity:0.4;
  }
  .glow.left{ left:-200px; background:radial-gradient(closest-side, var(--violet), transparent 70%); }
  .glow.right{ right:-200px; background:radial-gradient(closest-side, var(--blue), transparent 70%); }
  .glow.top{
    top:-220px; left:50%; transform:translateX(-50%);
    width:520px; height:340px;
    background:radial-gradient(closest-side, rgba(139,123,255,0.25), transparent 70%);
    filter:blur(50px); opacity:0.7;
  }

  .particles{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }

  .coin{
    position:absolute;
    display:block;
    filter:drop-shadow(0 0 6px rgba(78,161,255,0.35));
    animation:rise linear infinite;
  }
  .coin svg{ width:100%; height:100%; display:block; }

  .spark{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle, #bcd9ff 0%, #4ea1ff 45%, rgba(78,161,255,0) 75%);
    filter:blur(0.4px);
    animation:rise-spark linear infinite;
  }

  @keyframes rise{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    8%{ opacity:0.9; }
    88%{ opacity:0.6; }
    100%{ transform:translateY(-115vh) rotate(220deg); opacity:0; }
  }
  @keyframes rise-spark{
    0%{ transform:translateY(0) translateX(0) scale(0.6); opacity:0; box-shadow:0 0 4px 1px rgba(78,161,255,0.5); }
    10%{ opacity:1; }
    50%{ transform:translateY(-55vh) translateX(8px) scale(1); box-shadow:0 0 10px 2px rgba(120,190,255,0.65); }
    90%{ opacity:0.5; }
    100%{ transform:translateY(-110vh) translateX(-6px) scale(0.4); opacity:0; box-shadow:0 0 3px 1px rgba(78,161,255,0.2); }
  }
  @media (prefers-reduced-motion: reduce){ .particles{ display:none; } }

  /* ---------- glowing border (professional) ---------- */
  @keyframes border-glow{
    0%,100%{ box-shadow:0 0 0 1px rgba(139,123,255,0.18), 0 0 22px -6px rgba(139,123,255,0.35); }
    50%{ box-shadow:0 0 0 1px rgba(78,161,255,0.28), 0 0 26px -4px rgba(78,161,255,0.5); }
  }
  .glow-border{ animation:border-glow 4.5s ease-in-out infinite; }

  .grad-text{
    background:linear-gradient(95deg, var(--violet) 0%, var(--blue) 60%, #7fe3ff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  main{
    position:relative; z-index:1;
    width:100%; max-width:420px;
    display:flex; flex-direction:column; align-items:center;
  }

  /* ---------- hero ---------- */
  .kicker{
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px; letter-spacing:1.2px;
    color:var(--muted);
    background:var(--surface);
    border:1px solid var(--border-soft);
    padding:5px 12px 5px 10px;
    border-radius:999px;
    margin-bottom:20px;
  }
  .kicker .dot{ width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px rgba(23,201,131,0.18); }

  .avatar{
    width:80px; height:80px; border-radius:24px; padding:2px;
    background:linear-gradient(140deg, var(--violet), var(--blue));
    margin-bottom:18px;
  }
  .avatar-inner{
    width:100%; height:100%; border-radius:22px;
    background:var(--surface-solid);
    display:flex; align-items:center; justify-content:center;
  }
  .avatar-inner svg{ width:34px; height:34px; }

  .name-row{ display:flex; align-items:center; gap:7px; }
  .name-row h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size:27px; letter-spacing:0.2px;
  }
  .verified{
    width:18px; height:18px; background:var(--blue); border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .verified svg{ width:10px; height:10px; }

  .tagline{ margin-top:7px; font-size:14px; color:var(--muted); text-align:center; }
  .handle{ margin-top:5px; font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--muted); }

  /* ---------- section label ---------- */
  .section-label{
    width:100%; display:flex; align-items:center; gap:10px;
    margin:30px 0 12px;
  }
  .section-label span{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px; letter-spacing:1px; color:var(--muted);
    white-space:nowrap;
  }
  .section-label::before{ content:''; flex:1; height:1px; background:var(--border-soft); }
  .section-label::after{ content:''; flex:1; height:1px; background:var(--border-soft); }

  /* ---------- featured experience ---------- */
  .exp-card{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
    text-decoration:none; color:var(--ink);
    display:block;
    backdrop-filter:blur(10px);
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .exp-card:hover{
    transform:translateY(-3px);
    border-color:rgba(139,123,255,0.4);
    box-shadow:0 20px 40px -22px rgba(139,123,255,0.35);
  }
  .exp-card:active{ transform:translateY(0) scale(0.99); }

  .exp-thumb::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(8,9,13,0.05) 0%, rgba(8,9,13,0.15) 55%, rgba(8,9,13,0.75) 100%);
  }
  .exp-thumb .badge-new{
    position:absolute; top:12px; right:12px; z-index:2;
    background:rgba(23,201,131,0.15);
    color:var(--green);
    border:1px solid rgba(23,201,131,0.35);
    font-family:'JetBrains Mono', monospace;
    font-size:10px; font-weight:600; letter-spacing:0.6px;
    padding:4px 10px; border-radius:999px;
    backdrop-filter:blur(6px);
  }
  .play-overlay{ position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; }
  .play-circle{
    width:54px; height:54px; border-radius:50%;
    background:rgba(10,11,15,0.5);
    backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid rgba(255,255,255,0.35);
    transition:transform .18s ease, background .18s ease;
  }
  .exp-card:hover .play-circle{ background:rgba(139,123,255,0.35); border-color:rgba(255,255,255,0.6); }
  .play-circle svg{ width:20px; height:20px; }

  .exp-body{ padding:16px 18px 18px; }
  .exp-top-row{ display:flex; align-items:center; justify-content:space-between; }
  .exp-body h3{ font-family:'Space Grotesk', sans-serif; font-size:19px; font-weight:700; }
  .exp-body .kind{ font-size:11.5px; color:var(--muted); margin-top:2px; }

  .exp-stats{ display:flex; align-items:center; gap:16px; margin:12px 0 16px; }
  .exp-stats .s{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); }
  .live-dot{ width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px rgba(23,201,131,0.18); }

  .play-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(95deg, var(--violet), var(--blue));
    color:#0a0b10;
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px;
    padding:12px; border-radius:13px;
    transition:filter .15s ease, transform .1s ease;
  }
  .exp-card:hover .play-btn{ filter:brightness(1.08); }
  .exp-card:active .play-btn{ transform:scale(0.98); }
  .play-btn svg{ width:14px; height:14px; }

  /* ---------- social links ---------- */
  .links{ width:100%; display:flex; flex-direction:column; gap:11px; }

  .link-card{
    --accent:var(--discord);
    display:flex; align-items:center; gap:13px;
    width:100%; padding:14px 16px;
